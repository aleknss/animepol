media:
  - name: images
    label: Imágenes
    input: public/images/animes
    output: /images/animes
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]
    categories: [image]

content:
  - name: animes
    label: Animes
    type: collection
    path: src/content/animes
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: create
    view:
      fields: [titulo, anoLanzamiento, libertadEconomica, libertadPersonal]
      primary: titulo
      sort: [titulo, anoLanzamiento]
      search: [titulo, nombresAlternativos, slug]
      default:
        sort: titulo
        order: asc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: "URL: /anime/<slug>. No cambiar sin redirect."

      - name: nombresAlternativos
        label: Nombres alternativos
        type: string
        list: true

      - name: sinopsis
        label: Sinopsis
        type: text

      - name: analisisPolitico
        label: Análisis político
        type: text

      - name: anoLanzamiento
        label: Año
        type: number
        options:
          min: 1900
          max: 2100
          step: 1

      - name: imagen
        label: Imagen
        type: image
        options:
          media: images
          extensions: [jpg, jpeg, png, webp, avif]

      - name: libertadEconomica
        label: Libertad económica
        type: number
        required: true
        options:
          min: 1
          max: 5
          step: 1

      - name: libertadPersonal
        label: Libertad personal
        type: number
        required: true
        options:
          min: 1
          max: 5
          step: 1

      - name: generos
        label: Géneros
        type: reference
        options:
          collection: generos
          multiple: true
          value: "{primary}"
          label: "{primary}"

      - name: partido
        label: Partido (29N)
        type: reference
        options:
          collection: partidos
          multiple: false
          value: "{fields.slug}"
          label: "{fields.siglas}"

      - name: justificacionPartido
        label: Justificación del partido
        type: text
        description: "Sátira. Se muestra en la ficha junto al bloque del partido."

  - name: generos
    label: Géneros
    type: collection
    path: src/content/generos
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      fields: [nombre, slug]
      primary: nombre
      sort: [nombre]
      search: [nombre, slug]
      default:
        sort: nombre
        order: asc
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"

  - name: partidos
    label: Partidos (29N)
    type: collection
    path: src/content/partidos
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      fields: [siglas, nombre, orden]
      primary: siglas
      sort: [orden]
      search: [nombre, siglas, ideologia]
      default:
        sort: orden
        order: asc
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true

      - name: siglas
        label: Siglas
        type: string
        required: true

      - name: color
        label: Color
        type: string
        required: true
        pattern: "^#[0-9A-Fa-f]{6}$"

      - name: ideologia
        label: Ideología
        type: string
        required: true

      - name: descripcion
        label: Descripción satírica
        type: text
        required: true

      - name: logo
        label: Logo (ruta)
        type: string
        required: true
        description: "Ruta pública, por ejemplo /29n/PP.svg"

      - name: orden
        label: Orden
        type: number
        options:
          step: 1
